spring.application.name=document-qa-rag
server.port=8080
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# LangChain4j 1.20.2 uses these plain Java model beans configured in AiConfig.
rag.openai.chat-model=gpt-4o-mini
rag.openai.embedding-model=text-embedding-3-small
rag.openai.embedding-dimension=1536
rag.pinecone.namespace=documents
rag.pinecone.cloud=aws
rag.pinecone.region=us-east-1
rag.retrieval.top-k=4
rag.chunk-size=800
rag.chunk-overlap=120

# Secrets are read from environment variables and are never stored in this file.
# Required: OPENAI_API_KEY, PINECONE_API_KEY, PINECONE_INDEX_NAME
